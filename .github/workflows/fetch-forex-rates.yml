name: Fetch SBI Forex Rates

on:
  schedule:
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: fetch-sbi-forex-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Snapshot database statistics
        run: cp sbi_rates.db "$RUNNER_TEMP/sbi_rates-before.db"

      - name: Fetch and process forex rates
        id: fetch
        run: uv run python scraper.py

      - name: Publish database summary
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: |
          uv run python scripts/db_summary.py \
            --before "$RUNNER_TEMP/sbi_rates-before.db" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbi_rates.db
          if git diff --cached --quiet; then
            echo "### Publish result" >> "$GITHUB_STEP_SUMMARY"
            echo "No database changes to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: update forex rates $(date -u +%Y-%m-%d)"
            git push
            sha=$(git rev-parse --short HEAD)
            echo "### Publish result" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Pushed database update in commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
          fi
